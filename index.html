<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LedgerMatch — Intelligent Invoice & Payment Reconciliation Platform</title>
    <meta name="description" content="Intelligent Invoice & Payment Reconciliation Platform. Every Payment Has Its Invoice." />
    <meta property="og:title" content="LedgerMatch — Intelligent Invoice & Payment Reconciliation Platform" />
    <meta property="og:description" content="Intelligent Invoice & Payment Reconciliation Platform. Every Payment Has Its Invoice." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Design System CSS -->
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <div id="app-layout">
      <!-- Fixed Sidebar Navigation -->
      <aside id="sidebar" class="no-print">
        <div class="brand-header">
          <div class="brand-title">
            <span style="color: var(--accent-primary); font-size: 1.25rem;">⚖</span>
            <span>LedgerMatch</span>
          </div>
          <div class="brand-tagline">Every Payment Has Its Invoice</div>
        </div>

        <ul class="nav-menu">
          <li class="nav-item">
            <button class="nav-btn active" data-view="overview">
              <span>📊</span>
              <span>Overview</span>
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-btn" data-view="import">
              <span>📥</span>
              <span>Import Data</span>
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-btn" data-view="workspace">
              <span>⚡</span>
              <span>Workspace</span>
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-btn" data-view="matched">
              <span>✓</span>
              <span>Matched Records</span>
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-btn" data-view="partials">
              <span>⏳</span>
              <span>Partial Payments</span>
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-btn" data-view="unmatched-invoices">
              <span>📄</span>
              <span>Unmatched Invoices</span>
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-btn" data-view="unmatched-payments">
              <span>💳</span>
              <span>Unmatched Payments</span>
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-btn" data-view="duplicates">
              <span>⚠️</span>
              <span>Duplicate Detection</span>
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-btn" data-view="review">
              <span>🔍</span>
              <span>Manual Review</span>
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-btn" data-view="reports">
              <span>📋</span>
              <span>Reports</span>
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-btn" data-view="history">
              <span>⏱</span>
              <span>Audit History</span>
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-btn" data-view="settings">
              <span>⚙️</span>
              <span>Settings</span>
            </button>
          </li>
        </ul>

        <div style="padding: 1rem; border-top: 1px solid var(--border-subtle); font-size: 0.6875rem; color: var(--text-muted); text-align: center;">
          Institutional-Grade Reconciliation<br>Privacy-First · Local IndexedDB
        </div>
      </aside>

      <!-- Main Application Viewport -->
      <main id="main-viewport">
        <!-- Top Navigation Bar -->
        <header id="top-bar" class="no-print">
          <div class="top-bar-left">
            <button id="session-select-btn" class="session-selector">
              <span style="color: var(--accent-primary);">●</span>
              <span>Session: <strong id="current-session-label">Loading...</strong></span>
              <span style="font-size: 0.75rem; opacity: 0.6;">▼</span>
            </button>
          </div>

          <div class="top-bar-actions">
            <button id="top-reconcile-btn" class="btn btn-primary btn-sm">
              ▶ Auto-Match
            </button>
            <button id="theme-toggle-btn" class="btn btn-secondary btn-sm">
              ☀️ Light Mode
            </button>
          </div>
        </header>

        <!-- View Dynamic Root Container -->
        <div id="view-container"></div>
      </main>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="no-print"></div>

    <!-- Print Host Container for Clean A4 PDF Export -->
    <div id="print-host-container"></div>

    <!-- Application Script Entry Point -->
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
